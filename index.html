<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nanobot.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NanoBot Framework - Digital Swarm Intelligence</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Loading screen */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a1a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Courier New', monospace;
      }

      .loading-title {
        font-size: 3rem;
        color: #00FF41;
        text-shadow: 0 0 20px #00FF41, 0 0 40px #00FF41;
        margin-bottom: 2rem;
        letter-spacing: 0.2em;
        animation: glow 2s ease-in-out infinite alternate;
      }

      .loading-bar-container {
        width: 300px;
        height: 4px;
        background: rgba(0, 255, 65, 0.2);
        border-radius: 2px;
        overflow: hidden;
      }

      .loading-bar {
        height: 100%;
        background: linear-gradient(90deg, #00FF41, #00D9FF, #FF006E);
        width: 0%;
        animation: loading 2s ease-in-out infinite;
      }

      .loading-text {
        color: #00D9FF;
        margin-top: 1rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      @keyframes glow {
        from { text-shadow: 0 0 20px #00FF41, 0 0 40px #00FF41; }
        to { text-shadow: 0 0 30px #00FF41, 0 0 60px #00FF41, 0 0 80px #00D9FF; }
      }

      @keyframes loading {
        0% { width: 0%; margin-left: 0; }
        50% { width: 100%; margin-left: 0; }
        100% { width: 0%; margin-left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <div class="loading-title">NANOBOT</div>
        <div class="loading-bar-container">
          <div class="loading-bar"></div>
        </div>
        <div class="loading-text">Initializing Swarm Intelligence...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
